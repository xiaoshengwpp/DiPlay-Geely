name: 吉利兼容性记录
description: 逐项记录特定车型、固件和应用版本的成功、失败与未测
title: '[兼容性] 车型 / 年款 / 配置 - 固件版本'
body:
- type: markdown
  attributes:
    value: 请安全停车后测试。星越 L / 银河适配仍未验证；个人记录不等于整车系支持。Issues 和附件公开，先阅读 [日志与隐私指南](https://github.com/xiaoshengwpp/DiPlay-Geely#问题反馈与兼容性共建)。不得上传密码、令牌、MFi
      / 配对材料或签名密钥；日志、截图、录屏须人工遮盖 VIN、车牌、电话 / 账号 / 设备标识、SSID / MAC / IP、位置及路线。
- type: input
  id: car
  attributes:
    label: 车型 / 年款 / 配置
    description: 银河请写具体车型；例如：星越 L / 2025 / 揽星
  validations:
    required: true
- type: textarea
  id: head_unit
  attributes:
    label: 车机硬件、系统、完整固件与 Android 版本
    description: 未知项写“未知”；不要附含 VIN 等信息的原始截图
  validations:
    required: true
- type: textarea
  id: app_version
  attributes:
    label: 应用版本与来源
    description: 填下载发布页链接；自行构建填仓库、分支、提交 SHA。明确是本 fork、上游还是其他 fork
  validations:
    required: true
- type: input
  id: phone
  attributes:
    label: iPhone 型号与完整 iOS 版本
  validations:
    required: true
- type: input
  id: time
  attributes:
    label: 测试日期、发生时间及时区
  validations:
    required: true
- type: dropdown
  id: transport
  attributes:
    label: 连接方式
    options:
    - USB
    - Wi-Fi Direct
    - 车机热点
    - LocalOnlyHotspot
    - 多种（在步骤中逐项说明）
    - 未知
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: 连接环境与相关设置
    description: 无线频段 / 信道（如已知）、原车蓝牙是否同时连接、是否有其他投屏应用运行；勿填 SSID / 密码。显示问题附分辨率、帧率及缩放
  validations:
    required: false
- type: textarea
  id: results
  attributes:
    label: 逐项测试结果（通过 / 失败 / 未测）
    description: 只代表本次版本组合，未测不是支持。仪表 / HUD 等厂商功能需分别验证。
    value: '- 首次连接：未测

      - 断线重连：未测

      - 休眠唤醒：未测

      - 媒体声音：未测

      - 导航播报：未测

      - Siri：未测

      - 通话：未测

      - 音频切换与恢复：未测

      - 显示 / 分辨率：未测

      - 触控：未测

      - 方向盘按键：未测

      - 仪表 / HUD：未测'
  validations:
    required: true
- type: textarea
  id: procedure
  attributes:
    label: 测试步骤、预期 / 实际结果及持续时间
    description: 补充各项测试次数、稳定性与限制；声音问题注明输出位置和连接状态。已有故障议题请贴链接
  validations:
    required: true
- type: textarea
  id: diagnostics
  attributes:
    label: 经人工审查的最少必要日志 / 截图
    description: 首页 → 设置 → 诊断 → 保存诊断报告。Android 10+ 默认 Downloads/DiPlay；Android 9 选择位置。优先贴相关时间段脱敏片段；必要且整份安全才附报告。不可导出则写步骤和错误，不要求
      ADB。
  validations:
    required: false
- type: checkboxes
  id: safety
  attributes:
    label: 提交前检查
    options:
    - label: 测试、日志导出与设置变更均在安全停车时进行
      required: true
    - label: 已人工检查所填信息及附件，无上述个人信息、密码或密钥；知道议题和附件公开
      required: true
